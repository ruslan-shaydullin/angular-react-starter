<section *ngIf="s.selected.length" class="bulk panel" aria-label="Selected task actions">
  <h3>{{ s.selected.length }} tasks selected</h3>
  <div class="row">
    <label
      >Bulk status<select [(ngModel)]="status">
        <option *ngFor="let value of statuses" [value]="value">{{ statusLabel(value) }}</option>
      </select></label
    ><button (click)="s.dispatch('bulk.status', { ids: s.selected, status: status })">
      Apply status</button
    ><label
      >Bulk owner<select [(ngModel)]="assignee">
        <option value="">Unassigned</option>
        <option *ngFor="let member of s.state.members" [value]="member.id">
          {{ member.name }}
        </option>
      </select></label
    ><button (click)="s.dispatch('bulk.assign', { ids: s.selected, assignee: assignee })">
      Assign owner</button
    ><button (click)="s.selected = []">Clear selection</button>
  </div>
  <p class="muted">If any selected task fails validation, the entire change is rejected.</p>
</section>
