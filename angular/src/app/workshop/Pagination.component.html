<div class="pagination" aria-label="Task pages">
  <p aria-live="polite">Showing {{ result.start }}–{{ result.end }} of {{ result.total }} tasks</p>
  <div class="row">
    <button [disabled]="!result.hasPrevious" (click)="s.page = result.page - 1">
      Previous page</button
    ><span>Page {{ result.page }} of {{ result.pageCount }}</span
    ><button [disabled]="!result.hasNext" (click)="s.page = result.page + 1">Next page</button>
  </div>
</div>
