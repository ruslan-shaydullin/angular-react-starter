<aside class="detail panel" aria-label="Task details"><div class="row"><small>{{task.id}}</small><button (click)="s.navigate('tasks')">Close details</button></div><h2>{{task.title}}</h2><p>{{task.description||'Add a description to explain the acceptance criteria.'}}</p><dl class="facts"><dt>Owner</dt><dd>{{memberName(s.state,task.assignee)}}</dd><dt>Due</dt><dd>{{formatDate(task.dueDate)}}</dd><dt>Estimate</dt><dd>{{task.estimate}} points</dd></dl><div class="row"><button [disabled]="task.archived" (click)="s.editing=task.id">Edit task</button><button (click)="s.dispatch('task.duplicate',{id:task.id})">Duplicate task</button><button (click)="s.dispatch('task.archive',{id:task.id,archived:!task.archived})">{{task.archived?'Restore task':'Archive task'}}</button></div><ng-content></ng-content></aside>
