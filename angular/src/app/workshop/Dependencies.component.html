<section class="detail-section">
  <h3>Dependencies</h3>
  <ul class="plain-list">
    <li class="row" *ngFor="let item of relations.dependencies">
      <button class="text-button" (click)="s.navigate('tasks', item.id)">{{ item.title }}</button
      ><small>{{ item.status }}</small
      ><button [attr.aria-label]="'Remove dependency ' + item.title" (click)="remove(item.id)">
        Remove
      </button>
    </li>
  </ul>
  <form class="row" (ngSubmit)="add()">
    <label
      >Add dependency<select name="candidate" [(ngModel)]="candidate">
        <option value="">Choose a task</option>
        <option *ngFor="let item of candidates" [value]="item.id">{{ item.title }}</option>
      </select></label
    ><button [disabled]="!candidate || task.archived">Add dependency</button>
  </form>
  <p *ngIf="relations.dependents.length">Needed by: {{ dependentIds }}</p>
</section>
