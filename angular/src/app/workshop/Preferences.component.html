<section class="panel"><h2>Workspace preferences</h2><div class="stack"><label>Table density<select [ngModel]="s.state.preferences.density" (ngModelChange)="s.dispatch('preferences.set',{density:$event})"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label><label>Week starts on<select [ngModel]="s.state.preferences.weekStartsOn" (ngModelChange)="s.dispatch('preferences.set',{weekStartsOn:number($event)})"><option [ngValue]="1">Monday</option><option [ngValue]="0">Sunday</option></select></label><label class="check-label"><input type="checkbox" [ngModel]="s.state.preferences.showCompleted" (ngModelChange)="s.dispatch('preferences.set',{showCompleted:$event})">Show completed tasks in task lists and timeline</label><p>{{preferenceDescription(s.state.preferences)}}</p></div></section>
