<section class="panel">
  <h2>People and responsibilities</h2>
  <ul class="team-list">
    <li *ngFor="let member of s.state.members">
      <span class="avatar" aria-hidden="true">{{ initials(member.name) }}</span>
      <div>
        <h3>{{ member.name }}</h3>
        <p>{{ member.role }}</p>
      </div>
    </li>
  </ul>
  <details>
    <summary>Add a team member</summary>
    <form (ngSubmit)="add()" novalidate class="stack">
      <label>Member name<input name="name" [(ngModel)]="draft.name" /></label
      ><label>Member role<input name="role" [(ngModel)]="draft.role" /></label
      ><label
        >Initial capacity<input type="number" name="capacity" [(ngModel)]="draft.capacity" /></label
      ><button>Add member</button>
    </form>
  </details>
</section>
