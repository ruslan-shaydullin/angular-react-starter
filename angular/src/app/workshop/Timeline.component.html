<section class="panel"><h2>Delivery timeline</h2><p class="muted">Reference week: {{formatDate(week[0])}} to {{formatDate(week[6])}}. Tasks without due dates do not appear here.</p><ol class="timeline"><li *ngFor="let group of groups"><time [attr.datetime]="group.date">{{formatDate(group.date)}}</time><ul><li *ngFor="let task of group.tasks"><button class="text-button" (click)="s.navigate('tasks',task.id)">{{task.title}}</button> <small>{{task.status}}</small></li></ul></li></ol></section>
