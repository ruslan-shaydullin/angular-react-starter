<div [attr.data-density]="s.state.preferences.density">
  <workshop-undo-controls></workshop-undo-controls><workshop-keyboard-help></workshop-keyboard-help
  ><ng-container [ngSwitch]="s.route.page"
    ><ng-container *ngSwitchCase="'overview'"
      ><workshop-overview></workshop-overview><workshop-notifications></workshop-notifications
      ><workshop-timeline></workshop-timeline></ng-container
    ><ng-container *ngSwitchCase="'tasks'"
      ><div class="section-heading">
        <h2>Tasks</h2>
        <button class="primary" (click)="s.editing = true">New task</button>
      </div>
      <workshop-task-editor
        *ngIf="s.editing"
        [task]="editingTask"
        (closed)="s.editing = false"
      ></workshop-task-editor>
      <div [class.workspace-grid]="task">
        <section class="panel">
          <workshop-filters></workshop-filters><workshop-saved-views></workshop-saved-views>
          <div class="row">
            <workshop-row-selection [tasks]="matchingTasks"></workshop-row-selection>
          </div>
          <workshop-bulk-actions></workshop-bulk-actions
          ><ng-template #selection let-item
            ><workshop-row-selection [task]="item"></workshop-row-selection></ng-template
          ><workshop-task-table
            [selectable]="true"
            [selectionTemplate]="selection"
          ></workshop-task-table
          ><workshop-pagination></workshop-pagination>
        </section>
        <workshop-task-detail *ngIf="task as selected" [task]="selected"
          ><workshop-status-controls [task]="selected"></workshop-status-controls
          ><workshop-checklist [task]="selected"></workshop-checklist
          ><workshop-dependencies [task]="selected"></workshop-dependencies
          ><workshop-time-entry [task]="selected"></workshop-time-entry
          ><workshop-comments [task]="selected"></workshop-comments
        ></workshop-task-detail>
      </div>
      <workshop-empty-state
        *ngIf="s.route.taskId && !task"
        title="Task not found"
        description="The task may belong to a different workspace snapshot."
        action="Back to tasks"
        (activated)="s.navigate('tasks')"
      ></workshop-empty-state></ng-container
    ><ng-container *ngSwitchCase="'board'"
      ><workshop-filters></workshop-filters><workshop-board></workshop-board></ng-container
    ><ng-container *ngSwitchCase="'projects'"
      ><button (click)="project = null">New project</button
      ><workshop-project-editor
        *ngIf="project !== false"
        [project]="selectedProject"
        (closed)="project = false"
      ></workshop-project-editor
      ><workshop-projects (editProject)="project = $event"></workshop-projects></ng-container
    ><ng-container *ngSwitchCase="'team'"
      ><workshop-team></workshop-team><workshop-workload></workshop-workload
      ><workshop-capacity-editor></workshop-capacity-editor></ng-container
    ><ng-container *ngSwitchCase="'releases'"
      ><workshop-milestones></workshop-milestones><workshop-readiness></workshop-readiness
      ><workshop-release-notes></workshop-release-notes></ng-container
    ><workshop-activity *ngSwitchCase="'activity'"></workshop-activity
    ><ng-container *ngSwitchCase="'settings'"
      ><workshop-preferences></workshop-preferences><workshop-export></workshop-export
      ><workshop-import></workshop-import></ng-container
  ></ng-container>
</div>
