<section class="detail-section">
  <h3>Acceptance checklist</h3>
  <p>{{ completed }} of {{ task.checklist.length }} complete</p>
  <ul class="plain-list">
    <li *ngFor="let item of task.checklist">
      <label class="check-label"
        ><input
          type="checkbox"
          [checked]="item.done"
          [disabled]="task.archived || task.status === 'done'"
          (change)="s.dispatch('checklist.toggle', { id: task.id, itemId: item.id })"
        />{{ item.text }}</label
      >
    </li>
  </ul>
  <form (ngSubmit)="add()" class="row">
    <label
      >New checklist item<input name="checklistText" [(ngModel)]="text" maxlength="200" /></label
    ><button type="submit" [disabled]="task.archived || task.status === 'done'">Add item</button>
  </form>
</section>
