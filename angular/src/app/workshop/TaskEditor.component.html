<section class="panel" aria-labelledby="editor-title">
  <h2 id="editor-title">{{ task ? 'Edit task' : 'New task' }}</h2>
  <label *ngIf="!task"
    >Start from a template<select (change)="useTemplate($any($event.target).value)">
      <option value="">Blank task</option>
      <option *ngFor="let template of templates" [value]="template.id">{{ template.name }}</option>
    </select></label
  >
  <form (ngSubmit)="save()" novalidate class="stack">
    <label
      >Task title<input
        name="title"
        #titleInput
        [(ngModel)]="draft.title"
        maxlength="120"
        required /></label
    ><label
      >Description<textarea name="description" [(ngModel)]="draft.description" rows="3"></textarea>
    </label>
    <div class="row">
      <label
        >Project<select name="project" [(ngModel)]="draft.projectId">
          <option *ngFor="let project of s.state.projects" [value]="project.id">
            {{ project.name }}
          </option>
        </select></label
      ><label
        >Owner<select name="owner" [(ngModel)]="draft.assignee">
          <option value="">Unassigned</option>
          <option *ngFor="let member of s.state.members" [value]="member.id">
            {{ member.name }}
          </option>
        </select></label
      >
    </div>
    <div class="row">
      <label
        >Priority<select name="priority" [(ngModel)]="draft.priority">
          <option *ngFor="let priority of priorities">{{ priority }}</option>
        </select></label
      ><label>Due date<input type="date" name="dueDate" [(ngModel)]="draft.dueDate" /></label
      ><label
        >Estimate points<input
          type="number"
          name="estimate"
          min="0"
          max="100"
          step="1"
          [(ngModel)]="draft.estimate"
      /></label>
    </div>
    <p class="muted">Title needs 3–120 characters. Estimates use whole points from 0 to 100.</p>
    <div class="row">
      <button class="primary" type="submit">{{ task ? 'Save task' : 'Create task' }}</button
      ><button type="button" (click)="closed.emit()">Cancel</button>
    </div>
  </form>
</section>
