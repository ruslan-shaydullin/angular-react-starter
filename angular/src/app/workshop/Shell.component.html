<a class="skip-link" href="#main" (click)="skip($event)">Skip to workspace</a>
<div class="shell">
  <header class="masthead">
    <div>
      <h1>Release workshop</h1>
      <p>Plan, review, and ship a small release together.</p>
    </div>
    <span class="framework">Angular 14</span>
  </header>
  <nav aria-label="Workspace">
    <a
      *ngFor="let page of pages"
      [href]="routeHash(page)"
      [attr.aria-current]="s.route.page === page ? 'page' : null"
      >{{ pageLabel(page) }}</a
    >
  </nav>
  <div role="status" aria-live="polite">
    <p *ngIf="s.message" class="notice">{{ s.message }}</p>
  </div>
  <div *ngIf="s.errors.length" role="alert" class="error">
    <p>Resolve these issues and try again:</p>
    <ul>
      <li *ngFor="let error of s.errors">{{ error }}</li>
    </ul>
  </div>
  <main id="main" tabindex="-1"><ng-content></ng-content></main>
  <footer>
    <p>Fictional planning data. Reference date: 8 July 2022. Changes stay in this browser.</p>
  </footer>
</div>
