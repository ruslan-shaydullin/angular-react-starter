<section class="panel">
  <h2>Export workshop data</h2>
  <p>
    CSV includes tasks matching the current filters. Snapshots include the entire workspace,
    comments, and preferences.
  </p>
  <div class="row">
    <button (click)="csv()">Download task CSV</button
    ><button (click)="snapshot()">Download workspace snapshot</button>
  </div>
  <p class="muted">Spreadsheet formula-like text is escaped in CSV exports.</p>
</section>
