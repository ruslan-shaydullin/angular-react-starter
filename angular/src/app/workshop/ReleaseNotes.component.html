<section class="panel">
  <h2>Draft release notes</h2>
  <label
    >Release notes project<select [ngModel]="selected" (ngModelChange)="projectId = $event">
      <option *ngFor="let project of s.state.projects" [value]="project.id">
        {{ project.name }}
      </option>
    </select></label
  >
  <pre class="release-notes">{{ notes || 'Create a project before drafting release notes.' }}</pre>
  <button [disabled]="!notes" (click)="download()">Download release notes</button>
  <p class="muted">
    Only completed, active tasks are included. Review the draft before sharing it.
  </p>
</section>
