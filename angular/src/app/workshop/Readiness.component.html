<section class="panel"><h2>Release readiness</h2><p>A release is ready only when every included task is complete. Empty milestones require scope.</p><div class="project-grid"><article class="project-card" *ngFor="let release of releases"><h3>{{release.name}}</h3><p [class]="release.ready?'notice':'muted'">{{release.ready?'Ready for release review':'Work remains before review'}}</p><label>{{release.completed}} of {{release.total}} tasks complete<progress [value]="release.progress" max="100">{{release.progress}}%</progress></label><ul><li *ngFor="let reason of release.reasons">{{reason}}</li></ul></article></div></section>
