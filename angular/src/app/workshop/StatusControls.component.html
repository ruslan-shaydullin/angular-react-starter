<section class="detail-section">
  <h3>Workflow</h3>
  <label
    >Task status<select
      [disabled]="task.archived"
      [value]="task.status"
      (change)="changeStatus($event)"
    >
      <option *ngFor="let status of statuses" [value]="status" [selected]="task.status === status">
        {{ statusLabel(status) }}
      </option>
    </select></label
  >
  <p *ngIf="relations.blocked" class="notice">Finish dependencies before marking this task done.</p>
  <p class="muted">Checklist items must also be complete before a task can finish.</p>
</section>
